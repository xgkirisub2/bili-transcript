name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Check CLI
        run: uv run python -m bili_transcript --help
      - name: Build wheel
        run: uv build
